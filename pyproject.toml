[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldwork-agent"
version = "0.1.0"
description = "田野罗盘 — 面向人类学/社会学田野调查者的 AI 旅行规划 Agent（基于飞猪 FlyAI）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "dashscope>=1.20.0",
    # 百炼套餐 Key（sk-sp-）专属 OpenAI 兼容端点用 httpx 直调（kernel/llm.py）
    "httpx>=0.27",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.7",
    "python-docx>=1.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]
mcp = [
    # Task 5 实测：接线用低层 Server.add_request_handler + Server.run 形状，为 2.x API
    "mcp>=2,<3",
]

[project.scripts]
fieldwork = "fieldwork_agent.core.cli:main"
fieldwork-mcp = "fieldwork_agent.mcp_server.server:run_stdio"
fieldwork-mcp-http = "fieldwork_agent.mcp_server.http_entry:run_http"
fieldwork-web = "fieldwork_agent.web_host.app:main"

[tool.setuptools]
# 仓库根即包目录，映射为顶层包 fieldwork_agent；子包相对其自动解析
# tools/ 已随旧决策核心删除（能力实现迁至 kernel/sources 等子包），packages 同步移除
package-dir = { fieldwork_agent = "." }
packages = [
    "fieldwork_agent",
    "fieldwork_agent.core",
    "fieldwork_agent.kernel",
    "fieldwork_agent.kernel.sources",
    "fieldwork_agent.kernel.guidance",
    "fieldwork_agent.kernel.knowledge",
    "fieldwork_agent.kernel.aggregation",
    "fieldwork_agent.kernel.documents",
    "fieldwork_agent.kernel.repository",
    "fieldwork_agent.runtime",
    "fieldwork_agent.mcp_server",
    "fieldwork_agent.web_host",
    "fieldwork_agent.web_host.agent",
    "fieldwork_agent.web_host.api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
# L3 契约测试为 async（真实 ClientSession ↔ Server 内存会话），auto 模式免逐个标记
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# .audit/ 是复审过程的审计辅助材料（一次性诊断脚本 + 日志/截图），仅为可追溯性保留入库，
# 不属于生产代码，故排除在正式 lint 门禁之外（N15：明确审计辅助材料保留范围，
# 其脚本诊断不计入业务/正式测试的 ruff 计数）。.tmp_home/.superpowers 已 gitignore，ruff 自动跳过。
exclude = [".venv", "build", "dist", ".audit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
