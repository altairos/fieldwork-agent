[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldwork-agent"
version = "0.1.0"
description = "田野罗盘 — 面向人类学/社会学田野调查者的 AI 旅行规划 Agent（基于飞猪 FlyAI）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "dashscope>=1.20.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
fieldwork = "fieldwork_agent.core.cli:main"

[tool.setuptools]
# 仓库根即包目录，映射为顶层包 fieldwork_agent；子包相对其自动解析
package-dir = { fieldwork_agent = "." }
packages = [
    "fieldwork_agent",
    "fieldwork_agent.core",
    "fieldwork_agent.kernel",
    "fieldwork_agent.kernel.sources",
    "fieldwork_agent.kernel.guidance",
    "fieldwork_agent.kernel.aggregation",
    "fieldwork_agent.kernel.documents",
    "fieldwork_agent.tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
