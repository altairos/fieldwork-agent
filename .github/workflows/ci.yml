name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev + mcp)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      # 测试全部基于 mock，无需 DASHSCOPE_API_KEY / flyai CLI / 联网
      - name: Test (pytest)
        run: pytest -ra

      - name: Secrets-leak guard
        run: python tools/check_secrets_leak.py

  # A07：供应链门禁。单独 job（不进 4 格矩阵）——依赖面与 OS/Python 版本无关，
  # 多跑三遍只会浪费 runner 时间。
  audit:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable + dev + mcp)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
          pip install pip-audit

      # 已知漏洞即失败。--skip-editable：本仓库自身的 editable 安装不是 PyPI 依赖。
      - name: Python deps (pip-audit)
        run: pip-audit --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      # 只审计随包发布的依赖（--omit=dev）：当前 high 均来自 tailwindcss 3 的
      # 构建期传递依赖，修复需升 4（major），单独跟踪而不阻塞发布。
      # 显式 --registry：本地/企业镜像常不实现 audit 端点（npmmirror 即如此）。
      - name: Frontend deps (npm audit, prod only)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  # 前端独立 job（Task 9）：vitest 单测 + Playwright L4 端到端冒烟。
  # 不混入 Python 矩阵；e2e 跑在扩展后的 mock server（纯 Node、确定性），
  # 无需 Python 后端 / DASHSCOPE_API_KEY / flyai。L4 不允许静默 skip（spec §6.CI）。
  frontend:
    name: frontend (tsc + vitest + playwright L4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 5 / jsdom 30 / undici 8 均要求 Node >=22（jsdom 下限 22.22.2）
          # 本地开发环境为 Node 24，CI 与之保持一致
          node-version: "24"

      - name: Install deps
        run: npm ci

      # vitest 经 esbuild 转译不做类型校验，快照缺必填字段这类错误
      # 只有 build 才暴露；门禁用 --noEmit 只查类型不出产物
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit/component (vitest)
        run: npx vitest run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (L4, no silent skip)
        run: npm run test:e2e
