<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>田野罗盘</title>
    <!--
      字体：不再外链 Google Fonts（2026-10-20）。
      原因：该请求在国内网络下失败时，浏览器会静默回落到微软雅黑——
      整站宋体气质丢失，且这是"看不见的失败"，排查成本高。
      现在直接用系统已装的 Noto Serif SC（Windows 字体库里的 NotoSerifSC-VF.ttf），
      缺失时按 fontFamily 里的 STSong / SimSun 顺序回落，行为可预期。
    -->
    <script>
      // 防 FOUC：首帧渲染前从 localStorage 恢复主题到 html[data-theme]
      //（themes.css 入口）；非法/无值回落默认 cinnabar。与 main.tsx 的
      // applyTheme(readStoredTheme()) 同源双保险。
      try {
        var t = localStorage.getItem("fieldwork.theme");
        document.documentElement.dataset.theme =
          ["indigo", "bamboo", "wordblue", "obsidian", "vscode"].indexOf(t) >= 0
            ? t
            : "cinnabar";
      } catch (e) {
        document.documentElement.dataset.theme = "cinnabar";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
