<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>田野罗盘</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 防 FOUC：首帧渲染前从 localStorage 恢复主题到 html[data-theme]
      //（themes.css 入口）；非法/无值回落默认 cinnabar。与 main.tsx 的
      // applyTheme(readStoredTheme()) 同源双保险。
      try {
        var t = localStorage.getItem("fieldwork.theme");
        document.documentElement.dataset.theme =
          ["indigo", "bamboo", "wordblue", "obsidian", "vscode"].indexOf(t) >= 0
            ? t
            : "cinnabar";
      } catch (e) {
        document.documentElement.dataset.theme = "cinnabar";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
