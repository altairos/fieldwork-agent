# 田野罗盘 — Nginx 反向代理配置（备案完成后启用）
#
# ⚠️ 备案未完成前不要启用本文件：未备案域名走 80/443 会被阿里云网关拦截。
#    备案期间请用 http://<公网IP>:2143 直连（见 DEPLOY.md）。
#
# 启用步骤（备案通过后）：
#   1) dnf install -y nginx
#   2) 把 your-domain.com 换成已备案域名，将本文件放到 /etc/nginx/conf.d/fieldwork.conf
#   3) nginx -t && systemctl enable --now nginx
#   4) 域名 A 记录指向本机公网 IP
#   5) 申请免费 SSL 证书后启用下面的 443 段（阿里云 SSL 或 certbot）

# ---- HTTP：备案后先跑通，再按需 301 跳 HTTPS ----
server {
    listen 80;
    server_name your-domain.com;          # ← 换成你的已备案域名

    # 拿到证书后，取消下面两行注释即可强制跳转 HTTPS：
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:2143;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE 关键设置（事件流 /projects/:id/turns/:tid/events）──
        # 不关缓冲会导致流式回复被 Nginx 攒着不吐，前端看不到逐字输出。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

